[project]
name = "cleave"
version = "0.1.0"
description = "Universal chunking and information extraction — understand information before you cut it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling==2.95.0",
    "docling-core==2.77.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "networkx>=3",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3",
    "tiktoken>=0.7",
    "uvicorn>=0.30",
    "python-dotenv>=1.2.3",
    # Frame decode and image I/O. Shared by the video engine, standalone image
    # ingestion and PDF figure cropping, so it is core rather than an extra.
    "opencv-python>=4.10",
    "numpy>=2.0",
]

# Every extra below degrades gracefully: without it the matching input still
# runs and records WHY a producer did not, rather than failing the job.
[project.optional-dependencies]
# Visual understanding without an API: OCR and object detection on CPU.
vision = [
    "onnxruntime>=1.14",
    "huggingface-hub>=0.21",
    "rapidocr>=3.9",
]
# The video engine (vke/): ASR, scene cuts, multimodal boundaries.
video = [
    "faster-whisper>=1.1",
    "scenedetect>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
]
# Meetings & audio (vendored meetgraph engines): Resemblyzer speaker
# embeddings, and GPU transcription on Apple Silicon via MLX. torch is
# already in the tree through sentence-transformers, so Resemblyzer adds
# little on top.
meetings = [
    "resemblyzer>=0.1.1",
    # webrtcvad (a resemblyzer dependency) imports pkg_resources, which
    # setuptools removed in v81 — the last series that still ships it is 80.x.
    "setuptools>=70,<81",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Web ingestion. trafilatura is the fast path and is cheap to install;
# crawl4ai brings a headless browser and is only needed for JS-rendered pages.
web = [
    "trafilatura>=1.12",
]
web-rendered = [
    "crawl4ai>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import `cleave` from the working tree rather than an installed copy.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:torch.nn.modules.conv",
]

[tool.ruff]
line-length = 100
target-version = "py312"
